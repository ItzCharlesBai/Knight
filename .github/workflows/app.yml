# Knight 桌面客户端：测试并打包 Windows / macOS / Linux 安装包
# 手动运行（Actions → Knight 客户端 → Run workflow）或推送 v* 标签时触发；推送标签会自动发布 Release
name: Knight 客户端

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["app/**", "clash-verge-rev/**", ".github/workflows/app.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 扩展脚本测试
        run: npm ci && npm test
      - name: 客户端测试（含 mihomo -t 校验）
        working-directory: app
        run: npm ci && node scripts/fetch-core.mjs && npm test

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 打包
        run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # 没有签名证书时跳过签名
      - uses: actions/upload-artifact@v4
        with:
          name: knight-${{ matrix.target }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
