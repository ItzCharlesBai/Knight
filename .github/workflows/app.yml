# Ondine 桌面客户端：测试并打包 Windows / macOS / Linux 安装包
# - 推送代码：先跑测试；app/package.json 里的版本还没发布过时，打包三个平台并发布 Release（自动打上 v<版本> 标签）
#   所以发新版只要改 package.json 的 version 再推送；版本没变的推送只跑测试
# - 推送 v* 标签：这个标签还没有 Release 时打包发布
# - 手动运行（Actions → Ondine 客户端 → Run workflow）：只打包，安装包在这次运行的 Artifacts 里
name: Ondine 客户端

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["app/**", "clash-verge-rev/**", ".github/workflows/app.yml", ".github/release-notes.md"]
  pull_request:
    paths: ["app/**", "clash-verge-rev/**", ".github/workflows/app.yml"]

# 同一分支连着推送时排队跑，不会把同一个版本发布两次
concurrency:
  group: ondine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app/package.json
          sparse-checkout-cone-mode: false
      - id: v
        name: 这个版本发布过没有
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$(node -p 'require("./app/package.json").version')"; fi
          release=false
          if [ "$GITHUB_EVENT_NAME" = push ] && ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then release=true; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "$tag：release=$release"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 扩展脚本测试
        run: npm ci && npm test
      - name: 客户端测试（mihomo -t、sing-box check、xray run -test 校验生成的配置）
        working-directory: app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # 单元测试用不到 Electron 本体，少一次从 GitHub 下载
          ONDINE_GITHUB_TOKEN: ${{ github.token }} # 下载内核时查版本号的最后一招是 GitHub API，带上只读的令牌不容易被限流
        run: |
          npm ci
          node scripts/fetch-core.mjs
          node scripts/fetch-core.mjs --core sing-box --out "$RUNNER_TEMP/sing-box"
          node scripts/fetch-core.mjs --core xray --out "$RUNNER_TEMP/xray"
          SINGBOX_BIN="$RUNNER_TEMP/sing-box/sing-box" XRAY_BIN="$RUNNER_TEMP/xray/xray" npm test

  build:
    needs: [test, version]
    if: github.event_name == 'workflow_dispatch' || needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # electron-builder 会自己下载要打包的 Electron，不用 npm 再下一份
      - name: 打包
        run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # 没有签名证书时跳过签名
          ONDINE_GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: ondine-${{ matrix.target }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.deb
          if-no-files-found: error

  release:
    needs: [build, version]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      - name: 发布说明
        run: sed -e "s/{{tag}}/$TAG/g" -e "s/{{version}}/${TAG#v}/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
        env:
          TAG: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }} # 标签不存在时在这次提交上创建
          name: Ondine ${{ needs.version.outputs.tag }}
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*
          generate_release_notes: true
