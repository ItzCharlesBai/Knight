# =====================================================================
#  Clash Verge Rev · 全局扩展覆写配置（Merge）
#  防 DNS 泄露 · 防 WebRTC 泄露（需配合 TUN）· 性能优化
#
#  内核：mihomo ≥ 1.19（Clash Verge Rev 自带）
#  用法：订阅 → 全局扩展覆写配置 → 编辑文件 → 全选粘贴本文件 → 保存
#
#  注意：
#   · Verge 对 dns 段按子键整体替换：下面写出的每个 dns 子键都会覆盖订阅里的同名键
#   · ipv6 / unified-delay / tun 由「设置」页接管，写在这里会被丢弃，请在 GUI 中设置
#   · Merge 无法往规则列表头部插入规则，WebRTC / 加密 DNS 拦截规则由配套的 script.js 完成
#   · Merge 只能整体替换 dns 子键：订阅自带的 fake-ip-filter / nameserver-policy 会被下面的覆盖；
#     script.js 会与订阅原有的设置合并，兼容性更好，推荐只用脚本
#   · 本文件的取值与 script.js 保持一致，两者可以同时启用
# =====================================================================

# ---------------------------- 性能 ----------------------------
tcp-concurrent: true               # 域名有多个 IP 时并发握手，取最快的
geodata-loader: memconservative    # GEO 数据省内存加载
geo-auto-update: true
geo-update-interval: 24            # 小时
geox-url:                          # 国内可直连的 jsDelivr 镜像
  geoip: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb

profile:
  store-selected: true             # 记住各分组手动选择的节点
  store-fake-ip: true              # 重启后保留 Fake-IP 映射，避免已有连接断开

# ----------------------------- DNS -----------------------------
# 思路：国内域名 → 国内 DoH（固定直连）；已知境外域名 → 境外 DoH；未收录的域名 → Google DoH 并附带
# 一个通用的国内 ECS 网段，解析结果与国内 DNS 一致，GEOIP 分流不会误判。境外 DoH 经 respect-rules
# 按你的规则走代理（Merge 读不到订阅内容；用 script.js 时会固定走订阅兜底规则指向的分组，更稳）。
# 运营商只能看到国内域名的查询，境外查询的内容和你的真实 IP 都不会暴露。
dns:
  enable: true
  ipv6: false                      # 不返回 AAAA，防止 IPv6 流量绕开代理
  prefer-h3: false
  respect-rules: true              # 未固定出站的 DNS 查询按分流规则出站（境外 DoH 走代理）
  cache-algorithm: arc
  enhanced-mode: fake-ip           # redir-host 下每次解析境外域名都要等节点，统一用 Fake-IP（Verge TUN 的默认）
  fake-ip-filter-mode: blacklist
  fake-ip-filter:                  # 这些域名返回真实 IP（局域网、联网检测、NTP、STUN、游戏、远程控制、运营商一键登录）
    - "+.lan"
    - "+.local"
    - "+.localdomain"
    - "+.home.arpa"
    - "+.internal"
    - "+.ts.net"
    - "WORKGROUP"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "localhost.work.weixin.qq.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "time-ios.apple.com"
    - "time1.cloud.tencent.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "+.ntp.org.cn"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "+.stun.*.*.*.*.*"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "+.xboxlive.com"
    - "+.battlenet.com.cn"
    - "+.wotgame.cn"
    - "+.wggames.cn"
    - "+.wowsgame.cn"
    - "+.wargaming.net"
    - "+.mcdn.bilivideo.cn"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.cmpassport.com"
    - "id6.me"
    - "open.e.189.cn"
    - "mdn.open.wo.cn"
    - "opencloud.wostore.cn"
    - "auth.wosms.cn"
    - "+.10099.com.cn"
    - "geosite:cn"                   # 国内域名直接返回真实 IP，不用 Fake-IP
  default-nameserver:              # 仅用于解析 DoH 服务器域名（下面都写的 IP，基本用不到）
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:         # 解析机场节点域名（#DIRECT：固定直连、不受分流规则影响）
    - "https://223.5.5.5/dns-query#DIRECT"
    - "https://1.12.12.12/dns-query#DIRECT"
    - "223.5.5.5#DIRECT"               # 普通 UDP 作后备，有的网络会拦 DoH
    - "119.29.29.29#DIRECT"
  direct-nameserver:               # 直连流量使用的 DNS（直连时按你的运营商重新解析，速度不受影响）
    - "https://223.5.5.5/dns-query#DIRECT"
    - "https://1.12.12.12/dns-query#DIRECT"
    - "223.5.5.5#DIRECT"               # 普通 UDP 作后备，有的网络会拦 DoH
    - "119.29.29.29#DIRECT"
  nameserver:                      # 国内域名以外：Google DoH + 通用国内 ECS 网段（不是你的 IP），经代理发出，
                                   # 解析结果与国内 DNS 一致，GEOIP 分流不会误判
    - "https://8.8.8.8/dns-query#ecs=223.5.5.0/24&ecs-override=true"
    - "https://8.8.4.4/dns-query#ecs=223.5.5.0/24&ecs-override=true"
  nameserver-policy:               # 整体替换订阅里的 policy，按书写顺序匹配
    # 需要解析局域网主机名（router.lan 等）时取消下面两行注释，并换成你的路由器 IP
    # "+.lan,+.local,+.localdomain,+.home.arpa":
    #   - "192.168.1.1#DIRECT"
    # 系统联网检测、时间同步、游戏平台：交给国内 DNS，节点不可用时也不会出现“无 Internet”
    "+.msftconnecttest.com,+.msftncsi.com,time.windows.com,time.apple.com,time-ios.apple.com,time.asia.apple.com,+.pool.ntp.org,+.ntp.org.cn,+.srv.nintendo.net,+.stun.playstation.net,xbox.*.microsoft.com,+.xboxlive.com":
      - "https://223.5.5.5/dns-query#DIRECT"
      - "https://1.12.12.12/dns-query#DIRECT"
      - "223.5.5.5#DIRECT"               # 普通 UDP 作后备，有的网络会拦 DoH
      - "119.29.29.29#DIRECT"
    "geosite:cn,private":          # 国内域名：国内 DNS，固定直连
      - "https://223.5.5.5/dns-query#DIRECT"
      - "https://1.12.12.12/dns-query#DIRECT"
      - "223.5.5.5#DIRECT"               # 普通 UDP 作后备，有的网络会拦 DoH
      - "119.29.29.29#DIRECT"
    "geosite:geolocation-!cn":     # 已知境外域名：与 nameserver 相同（带 ECS，经代理）
      - "https://8.8.8.8/dns-query#ecs=223.5.5.0/24&ecs-override=true"
      - "https://8.8.4.4/dns-query#ecs=223.5.5.0/24&ecs-override=true"
  fallback: []                     # 清空订阅可能自带的 fallback（旧式配置，易导致泄露）
