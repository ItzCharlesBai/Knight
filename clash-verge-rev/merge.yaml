# =====================================================================
#  Clash Verge Rev · 全局扩展覆写配置（Merge）
#  防 DNS 泄露 · 防 WebRTC 泄露（需配合 TUN）· 性能优化
#
#  内核：mihomo ≥ 1.19（Clash Verge Rev 自带）
#  用法：订阅 → 全局扩展覆写配置 → 编辑文件 → 全选粘贴本文件 → 保存
#
#  注意：
#   · Verge 对 dns 段按子键整体替换：下面写出的每个 dns 子键都会覆盖订阅里的同名键
#   · ipv6 / unified-delay / tun 由「设置」页接管，写在这里会被丢弃，请在 GUI 中设置
#   · Merge 无法往规则列表头部插入规则，WebRTC/QUIC/DoH 分流规则由配套的 script.js 完成
#   · 本文件的取值与 script.js 保持一致，两者可以同时启用
# =====================================================================

# ---------------------------- 性能 ----------------------------
tcp-concurrent: true               # 域名有多个 IP 时并发握手，取最快的
geodata-loader: memconservative    # GEO 数据省内存加载
geo-auto-update: true
geo-update-interval: 24            # 小时
geox-url:                          # 国内可直连的 jsDelivr 镜像
  geoip: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb

profile:
  store-selected: true             # 记住各分组手动选择的节点
  store-fake-ip: true              # 重启后保留 Fake-IP 映射，避免已有连接断开

# -------------------------- 域名嗅探 --------------------------
# 应用自带 DoH 或直接用 IP 连接时，从 TLS/HTTP/QUIC 握手里还原域名，保证按域名分流
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.oray.com"
    - "+.sunlogin.net"

# ----------------------------- DNS -----------------------------
# 思路：国内域名 → 国内 DoH 直连；其余所有域名 → 境外 DoH，且经 respect-rules 走代理发出。
# 运营商只能看到国内域名的查询，境外域名的查询内容和你的真实 IP 都不会暴露给境外 DNS。
dns:
  enable: true
  ipv6: false                      # 不返回 AAAA，防止 IPv6 流量绕开代理
  prefer-h3: false
  respect-rules: true              # DNS 查询本身也按规则分流（境外 DoH 走代理）
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:                  # 这些域名返回真实 IP（局域网、联网检测、NTP、STUN、游戏）
    - "+.lan"
    - "+.local"
    - "+.localdomain"
    - "+.home.arpa"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "localhost.work.weixin.qq.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "+.ntp.org.cn"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "+.stun.*.*.*.*.*"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "+.xboxlive.com"
  default-nameserver:              # 仅用于解析 DoH 服务器域名（下面都写的 IP，基本用不到）
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:         # 解析机场节点域名
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver:               # 直连流量使用的 DNS
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver:                      # 默认（境外）DNS，经代理发出
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  nameserver-policy:               # 整体替换订阅里的 policy，按书写顺序匹配
    # 需要解析局域网主机名（router.lan 等）时取消下面两行注释，并换成你的路由器 IP
    # "+.lan,+.local,+.localdomain,+.home.arpa":
    #   - 192.168.1.1
    "geosite:cn,private":
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
  fallback: []                     # 清空订阅可能自带的 fallback（旧式配置，易导致泄露）
