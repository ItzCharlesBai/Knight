# 打包配置：先运行 npm run core（或 dist:* 脚本会自动下载对应平台的内核和 GEO 数据）
appId: io.github.ondine.app
productName: Ondine
copyright: MIT
directories:
  output: dist
files:
  - package.json
  - src/**
  - resources/icons/**
  - "!**/*.map"
  # ssh2 的原生加速模块是给 Node 编译的，Electron 里用不上（ssh2 会自动改用纯 JS 实现）
  - "!node_modules/ssh2/lib/protocol/crypto/build/**"
  - "!node_modules/cpu-features/**"
  - "!node_modules/nan/**"
  - "!node_modules/*/{test,tests,examples,experiment}/**"
# 没有需要为 Electron 重新编译的原生模块
npmRebuild: false
extraResources:
  # 内核：resources/core/<os>-<arch>/ → 安装目录 resources/core/
  - from: resources/core/${os}-${arch}
    to: core
  - from: resources/geo
    to: geo
  - from: resources/icons
    to: icons
  # 仓库里的防泄露脚本与 Merge 配置，应用直接读取（改动后重新打包即可）
  - from: ../clash-verge-rev
    to: extensions
    filter: ["script.js", "merge.yaml"]
asar: true
publish: null
# 图标由 scripts/icons.mjs 生成：小尺寸的线条单独加粗，任务栏、Finder 列表里也看得清
icon: resources/icons/icon.png
protocols:
  - name: Clash 订阅
    schemes: [clash, mihomo, ondine]

win:
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Ondine
  artifactName: Ondine-${version}-win-${arch}-setup.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.icns
  category: public.app-category.utilities
  artifactName: Ondine-${version}-mac-${arch}.${ext}
  # 没有开发者证书：做 ad-hoc 签名，Apple 芯片的 Mac 才能打开（第一次需右键 → 打开）；ad-hoc 签名不能配 hardened runtime
  identity: "-"
  hardenedRuntime: false
  # 内核需要 setuid 才能开虚拟网卡，所以它放在用户目录运行，不在签名的 .app 里修改

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  icon: build/icons
  # 窗口和 ondine.desktop 对上（Wayland 的 app_id），任务栏才显示小猫图标
  syncDesktopName: true
  category: Network
  maintainer: Ondine
  synopsis: 多内核桌面代理客户端
  artifactName: Ondine-${version}-linux-${arch}.${ext}
deb:
  depends: [libcap2-bin, policykit-1]
