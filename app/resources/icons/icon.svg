<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <!-- 绕月任务海报：深空、月球、地球边缘的光，骑士剪影立在地平线上，一条自由返回轨道 -->
  <defs>
    <radialGradient id="sky" cx="70%" cy="20%" r="95%"><stop offset="0" stop-color="#16295a"/><stop offset=".55" stop-color="#0a1229"/><stop offset="1" stop-color="#04060b"/></radialGradient>
    <radialGradient id="earth" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#2a63c4"/><stop offset=".18" stop-color="#0f2c63"/><stop offset=".5" stop-color="#060c1c"/></radialGradient>
    <radialGradient id="flare" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe3c2"/><stop offset=".3" stop-color="#ff9a52" stop-opacity=".7"/><stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/></radialGradient>
    <clipPath id="tile"><rect x="24" y="24" width="464" height="464" rx="112"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <g clip-path="url(#tile)">
