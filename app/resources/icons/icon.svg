    <g fill="#fff"><circle cx="92" cy="96" r="2"/><circle cx="150" cy="64" r="1.3" opacity=".7"/><circle cx="70" cy="190" r="1.4" opacity=".6"/><circle cx="196" cy="128" r="1.1" opacity=".5"/><circle cx="440" cy="420" r="1.4" opacity=".5"/><circle cx="120" cy="300" r="1" opacity=".5"/></g>
    <image href="MOON" x="98" y="52" width="316" height="316"/>
    <path d="M40 360 C 150 330, 330 196, 440 168 C 494 154, 500 200, 452 232 C 410 258, 360 252, 350 214" fill="none" stroke="#ff7a3d" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 13"/>
    <circle cx="350" cy="214" r="6" fill="#ffb46b"/>
    <circle cx="256" cy="980" r="560" fill="url(#earth)"/>
    <circle cx="256" cy="980" r="560" fill="none" stroke="#7fbcff" stroke-width="3" opacity=".9"/>
    <circle cx="256" cy="980" r="560" fill="none" stroke="#5aa9ff" stroke-width="16" opacity=".35" filter="url(#glow)"/>
    <ellipse cx="350" cy="424" rx="120" ry="16" fill="url(#flare)"/>
    <g transform="translate(34 58) scale(.88)">
      <path d="M196 388 C206 336 222 306 240 288 C214 292 186 300 166 296 C146 292 132 276 136 256 C140 236 162 218 190 206 C210 176 222 150 230 120 C238 132 246 144 254 150 C304 150 352 190 362 252 C370 306 362 352 352 388 Z" fill="#05070c"/>
      <path d="M254 150 C304 150 352 190 362 252 C370 306 362 352 352 388" fill="none" stroke="#ffb46b" stroke-width="3" stroke-opacity=".55"/>
      <circle cx="198" cy="222" r="7" fill="#ffb46b" opacity=".9"/>
    </g>
  </g>
</svg>
