<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" fill="none">
  <!-- 自由返回轨道：从地球出发绕到月球背面再回来（示意） -->
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5aa9ff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#ffb070" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <path d="M0 590 C 260 520, 520 360, 690 210 C 790 120, 900 110, 890 210 C 880 300, 760 300, 700 240" stroke="url(#g)" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round"/>
  <circle cx="700" cy="240" r="3.5" fill="#ff7a3d"/>
  <circle cx="700" cy="240" r="10" fill="#ff7a3d" fill-opacity=".18"/>
</svg>
